<svg 
  width="120" 
  height="120" 
  viewBox="0 0 120 120" 
  xmlns="http://www.w3.org/2000/svg"
  aria-label="Doot Agent"
>
  <style>
    .doot-planet {
      fill: #000000;
    }

    .doot-satellite {
      fill: #000000;
      stroke: #FFFFFF;
      stroke-width: 6px;
    }
  </style>

  <!-- Big Ball (Planet) - positioned to center the whole icon -->
  <circle class="doot-planet" cx="60" cy="75" r="36" />

  <!-- Small Ball (Satellite) positioned at top with proper clearance -->
  <circle class="doot-satellite" cx="60" cy="39" r="36" />
</svg>
